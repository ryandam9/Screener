const settings=()=>wrap('settings',`<header class="topbar"><div><h1>Settings</h1><small>Data, appearance and your daily digest</small></div></header><div class="content"><div class="settingsgrid"><div><section class="settingsection"><h2>Data sources</h2><div class="panel">${[['ASX','asx.db','2.2 MB'],['US','us.db','7.3 MB'],['NSE','nse.db','912 KB']].map(([market,file,size])=>`<div class="settingrow"><div><label><span class="good">✓</span> ${market} <span class="sub">· ${file}</span></label><div class="sub">Up to date · ${size}<br>Synced today, 7:04 AM</div></div><span class="sub">↻</span></div>`).join('')}<div class="settingbody"><div class="filters"><span class="control">Re-download</span><span class="control">Clear cache</span></div><div class="caption">Bucket: hive-in-the-cloud.s3.ap-southeast-2.amazonaws.com</div></div></div></section><section class="settingsection"><h2>Appearance</h2><div class="panel"><div class="settingrow"><div><label>Theme</label><div class="sub">Follow system</div></div><div class="filters"><span>Light</span><span class="on">System</span><span>Dark</span></div></div><div class="settingrow"><div><label for="compact">Compact rows</label><div class="sub">Fit more instruments on screen</div></div><input id="compact" type="checkbox"></div></div></section><section class="settingsection"><h2>Watchlist</h2><div class="panel"><div class="settingrow"><div><label>Starred tickers</label><div class="sub">1 ASX</div></div><span class="sub">Clear</span></div></div></section><section class="settingsection"><h2>Reports</h2><div class="panel"><div class="settingrow"><div><label>Runs and CSV export</label><div class="sub">Every published run, exportable as CSV</div></div><span>→</span></div></div></section></div><div><section class="settingsection"><h2>Daily digest</h2><div class="panel"><div class="settingrow"><div><label for="alerts">Screen alerts</label><div class="sub">A calm summary when new tickers<br>enter your 7 day screens</div></div><input id="alerts" type="checkbox" checked></div><div class="settingbody"><div class="status">✓ Alerts on · System allowed</div></div><div class="settingrow"><div><label>Checks around 09:00 and 11:00</label><div class="sub">Runs on the next app open on this desktop.</div></div></div><div class="settingbody"><div class="eyebrow">Delivery</div><label class="delivery"><input type="radio" name="delivery" checked><span>Summary only<small>One notification for each check with new matches.</small></span></label><label class="delivery"><input type="radio" name="delivery"><span>Summary + watchlist<small>Also show a quiet alert for starred tickers.</small></span></label><div class="sub" style="margin-top:15px">Markets</div><div class="filters"><label class="control"><input type="checkbox" checked> ASX</label><label class="control"><input type="checkbox" checked> US</label><label class="control"><input type="checkbox" checked> NSE</label></div><label class="sub" for="minimum">Minimum weekly move</label><select id="minimum"><option>Use screen cut-off</option><option>10%</option><option>25%</option></select><div class="caption">Applied after the screen’s published cut-off.</div></div><div class="settingrow"><div><label for="stale">Stale-data warning</label><div class="sub">After repeated failures and data<br>older than 24 hours</div></div><input id="stale" type="checkbox" checked></div><div class="settingbody"><div class="filters"><span class="control primary">Check now</span><span class="control">Send sample</span></div></div></div></section><section class="settingsection"><h2>Activity</h2><div class="panel pad"><div class="sub">Alert sent · 2026-11-04</div><div class="caption">220 new in the 7 day screen — OMEX +1981.8%, ULBI +145.8%, ULH +93.2%, REPL +58.2% and 216 more · 2 ASX · …</div></div></section></div><section class="settingsection settingswide"><h2>About Stocks Analysis</h2><div class="panel settingbody"><p>Reads the growth-screener SQLite databases published to s3://hive-in-the-cloud and renders them on device. Files are cached locally, so everything except refresh works without a connection.</p><div class="caption">Figures are screener output — window endpoints, not live quotes — and are not investment advice.</div></div></section></div></div>`);
const views={dashboard,overview,performance,metrics,settings};const container=document.getElementById('screens');container.innerHTML=Object.entries(views).map(([key,fn])=>`<section id="screen-${key}" ${key==='dashboard'?'':'hidden'} aria-label="${key}">${fn()}</section>`).join('');
function show(key){root.querySelectorAll('.review [data-screen]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.screen===key)));Object.keys(views).forEach(k=>document.getElementById('screen-'+k).hidden=k!==key);}
root.addEventListener('click',e=>{const screen=e.target.closest('[data-screen]');if(screen)show(screen.dataset.screen);const go=e.target.closest('[data-go]');if(go){e.preventDefault();show(go.dataset.go);}const star=e.target.closest('[data-star]');if(star){const on=star.textContent==='☆';root.querySelectorAll('[data-star]').forEach(s=>{s.textContent=on?'★':'☆';s.setAttribute('aria-label',on?'Remove from watchlist':'Add to watchlist');});}});
if(globalThis.lucide)lucide.createIcons();
</script></body></html>
