name: screener
description: Stocks Analysis — reads SQLite growth-screener databases from S3 and renders them offline.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  intl: ^0.20.0
  path: ^1.9.0
  path_provider: ^2.1.0
  provider: ^6.1.0
  shared_preferences: ^2.3.0
  sqflite: ^2.4.0
  sqflite_common_ffi: ^2.3.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  # Inter, bundled rather than fetched at runtime: the app is offline-first and
  # the type must render identically with no connection. SIL Open Font License,
  # see assets/fonts/Inter-LICENSE.txt.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
